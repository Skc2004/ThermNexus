[package]
name = "thermalnexus-core"
version = "1.0.0"
edition = "2021"
description = "Hyper-Optimized Rust Engine for ThermalNexus Control"

[dependencies]
memmap2 = "0.9"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
